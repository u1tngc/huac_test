<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC学科ツール パスワードリセット（確認）</title>
    <link rel="stylesheet" href="../static/GK1C0041.css">
</head>

<body>
    <header>
        <h1>HUAC学科ツール</h1>
    </header>

    <main>
        <section class="options">
            <h2>パスワードリセット（確認）</h2>
            {% if err %}
            <a class="err">{{ err }}</a>
            <br><br>
            {% endif %}
            <a>下記の学生のパスワードをリセットします。よろしいですか。</a>
            <br>
            <br>
            {# gakusei は [0]学籍番号 [1]氏名 #}
            <form method="post" action="/GK_db012">
                <div class="data-section">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>学籍番号</th>
                                <th>氏名</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>{{ gakusei[0] }}</td>
                                <td>{{ gakusei[1] }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="button-group">
                    <button type="button" onclick="location.href='/GK_db011'" class="menu-button">戻る</button>
                    <button type="submit" class="execute-button">次へ</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
</body>

</html>
