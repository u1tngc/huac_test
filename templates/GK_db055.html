<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC学科ツール 養成状況更新（学生選択）</title>
    <link rel="stylesheet" href="../static/GK1C0047.css">
</head>

<body>
    <header>
        <h1>HUAC学科ツール</h1>
    </header>

    <main>
        <section class="options">
            <h2>養成状況更新（学生選択）</h2>
            {% if err1 %}
            <div class="err">{{ err1 }}</div>
            <br>
            {% endif %}
            <form method="post" action="/GK_db055" id="studentForm">
                <h3>■対象学生■</h3>
                <a>養成した学生を選択してください。</a>
                <div class="data-section">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>✓</th>
                                <th>学生名</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for student in wk54yoseiStudent %}
                            <tr>
                                <td>
                                    <input type="checkbox"
                                           name="yoseiStudent"
                                           value="{{ student[0] }}"
                                           class="item-checkbox">
                                </td>
                                <td>{{ student[1] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <div class="clear-button-area">
                    <button type="button" onclick="toggleAll(false)" class="clear-button">全解除</button>
                </div>

                <div class="button-group">
                    <button type="submit" name="action" value="back" class="menu-button">戻る</button>
                    <button type="submit" name="action" value="next" class="execute-button"
                            onclick="return validateStudent()">次へ</button>
                </div>
            </form>

            <script>
                function toggleAll(checked) {
                    document.querySelectorAll('.item-checkbox').forEach(cb => cb.checked = checked);
                }

                function validateStudent() {
                    const checked = document.querySelectorAll('.item-checkbox:checked');
                    if (checked.length === 0) {
                        alert('学生を1名以上選択してください。');
                        return false;
                    }
                    return true;
                }
            </script>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
</body>

</html>
