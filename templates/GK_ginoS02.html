<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC学科ツール 技能審査問題（問題文）</title>
    <link rel="stylesheet" href="../static/GK1C0005.css">
</head>

<body>
    <header>
        <h1>HUAC学科ツール</h1>
    </header>

    <main>
        <section class="options">
            <h2>技能審査問題</h2>
            <form method="post" action="/GK_ginoS02">
                <div class="text-container"><a>{{ question | trim | safe }}</a></div>

                <div class="form-group answer-group">
                    <label for="answer">回答記入欄</label>
                    <textarea id="answer" name="answer" rows="4" placeholder="ここに回答を入力してください"
                        required>{{ answer_input | default('', true) }}</textarea>
                </div>

                <div class="button-group">
                    <button type="button" onclick="location.href='/GK_menu01'" class="menu-button">Menu</button>
                    <button type="submit" class="execute-button">答え</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
</body>

</html>
