<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC気象ツール</title>
    <link rel="stylesheet" href="../static/GK1C0100.css">

                    </div>

                    <div class="form-group">
                        <label for="additionalInfo">翻訳するMETAR:</label>
                        <div>
                            <textarea id="metar" name="metar" rows="4"
                                placeholder="処理区分：翻訳　の場合に翻訳するMETARを入力"></textarea>
                        </div>
                        <label for="additionalInfo">翻訳するTAF:</label>
                        <div>
                            <textarea id="taf" name="taf" rows="4" placeholder="処理区分：翻訳　の場合に翻訳するtafを入力"></textarea>
                        </div>
                    </div>
                    <button type="button" onclick="location.href='/menu'" class="menu-button">Menu</button>
                    <button type="submit">実行</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 Yuichi Taniguchi</p>
        </footer>
    </div>
</body>

</html>
