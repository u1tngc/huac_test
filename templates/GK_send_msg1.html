<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC学科ツール MSG送信</title>
    <link rel="stylesheet" href="../static/GK1C0070.css">
</head>

<body>
    <header>
        <h1>HUAC学科ツール</h1>
    </header>
    <main>
        <section class="options">
            <h2>MSG送信</h2>
            {% if err %}
            <div class="err">
                {{ err }}
            </div>
            <br>
            {% endif %}
            <form method="post" action="/GK_send_msg1">
                <div class="data-section">
                    <div class="form-group">
                        <label for="msg_kbn">区分:</label>
                        <select id="msg_kbn" name="msg_kbn">
                            <option value="1" {% if msg_array and msg_array[0]=="1" %}selected{% elif not msg_array
                                %}selected{% endif %}>通知</option>
                            <option value="2" {% if msg_array and msg_array[0]=="2" %}selected{% endif %}>注意</option>
                            <option value="3" {% if msg_array and msg_array[0]=="3" %}selected{% endif %}>警告</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="msg_title">タイトル:</label>
                        <input type="text" id="msg_title" name="msg_title" maxlength="50" placeholder="タイトルを入力（50字以内）"
                            value="{{ msg_array[1] if msg_array else '' }}">
                    </div>
                    <div class="form-group">
                        <label for="msg_body">本文:</label>
                        <textarea id="msg_body" name="msg_body" rows="8" maxlength="1000"
                            placeholder="本文を入力（1000字以内）">{{ msg_array[2] if msg_array else '' }}</textarea>
                    </div>
                </div>
                <div class="button-group">
                    <button type="button" onclick="location.href='/GK_menu01'" class="menu-button">Menu</button>
                    <button type="submit" class="execute-button">確認</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
</body>

</html>
