<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC学科ツール 学生情報登録</title>
    <link rel="stylesheet" href="../static/GK1C0041.css">
</head>

<body>
    <header>
        <h1>HUAC学科ツール</h1>
    </header>

    <main>
        <section class="options">
            <h2>学生情報登録</h2>
            {% if err %}
            <a class="err">{{ err }}</a>
            <br><br>
            {% endif %}
            <form method="post" action="/GK_db004">
                <div class="data-section">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>学籍番号</th>
                                <th>氏名</th>
                                <th>権限</th>
                                <th>出題区分</th>
                                <th>資格</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><input type="text" name="id" class="table-input"></td>
                                <td><input type="text" name="name" class="table-input"></td>
                                <td>
                                    <select name="status_cd" class="table-input">
                                        <option value="0">学生</option>
                                        <option value="1">自家用</option>
                                        <option value="6">学科班</option>
                                        {% if session['authority'] == 9 %}
                                        <option value="7">学科班主任</option>
                                        <option value="8">教官</option>
                                        <option value="9">管理者</option>
                                        {% endif %}
                                    </select>
                                </td>
                                <td>
                                    <select name="kanri_cd" class="table-input">
                                        <option value="0">出題無</option>
                                        <option value="1">自家用</option>
                                        <option value="2">赤帽</option>
                                    </select>
                                </td>
                                <td>
                                    <select name="shikaku_cd" class="table-input">
                                        <option value="0">練許生</option>
                                        <option value="1">自家用</option>
                                        {% if session['authority'] == 9 %}
                                        <option value="2">教証</option>
                                        {% endif %}
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="button-group">
                    <button type="button" onclick="location.href='/GK_menu01'" class="menu-button">戻る</button>
                    <button type="submit" class="execute-button">登録</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
</body>

</html>
