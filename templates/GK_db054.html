<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC学科ツール 養成状況更新（課目・日付入力）</title>
    <link rel="stylesheet" href="../static/GK1C0047.css">
</head>

<body>
    <header>
        <h1>HUAC学科ツール</h1>
    </header>

    <main>
        <section class="options">
            <h2>養成状況更新（入力）</h2>
            {% if err1 %}
            <div class="err">{{ err1 }}</div>
            <br>
            {% endif %}
            <form method="post" action="/GK_db054" id="yoseiForm">
                <h3>■養成課目■</h3>
                <a>養成を行った課目を選択してください。</a>
                <div class="data-section">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>✓</th>
                                <th>養成課目</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for kamoku in wk54yoseiKamoku %}
                            <tr>
                                <td>
                                    <input type="checkbox"
                                           name="yoseiKamoku"
                                           value="{{ kamoku[0] }}"
                                           class="kamoku-checkbox"
                                           {% if wk54yoseiKamokuSelected and kamoku[0] in wk54yoseiKamokuSelected %}checked{% endif %}>
                                </td>
                                <td>{{ kamoku[1] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <div class="clear-button-area">
                    <button type="button" onclick="toggleAllKamoku(false)" class="clear-button">全解除</button>
                </div>

                <br>
                <h3>■養成日■</h3>
                <a>養成を行った日付を入力してください。</a>
                <div class="input-section">
                    <input type="date" name="yoseiDate" class="table-input"
                           value="{{ wk54yoseiDate if wk54yoseiDate else '' }}">
                </div>

                <div class="button-group">
                    <button type="button" onclick="location.href='/GK_menu01'" class="menu-button">戻る</button>
                    <button type="submit" class="execute-button">次へ</button>
                </div>
            </form>

            <script>
                function toggleAllKamoku(checked) {
                    document.querySelectorAll('.kamoku-checkbox').forEach(cb => cb.checked = checked);
                }

                document.getElementById('yoseiForm').addEventListener('submit', function (e) {
                    const checked = document.querySelectorAll('.kamoku-checkbox:checked');
                    if (checked.length === 0) {
                        alert('養成課目を1つ以上選択してください。');
                        e.preventDefault();
                        return;
                    }
                    const date = document.querySelector('input[name="yoseiDate"]').value;
                    if (!date) {
                        alert('養成日を入力してください。');
                        e.preventDefault();
                    }
                });
            </script>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
</body>

</html>
