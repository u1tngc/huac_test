<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC学科ツール 学科試験情報照会</title>
    <link rel="stylesheet" href="../static/GK1C0040.css">
</head>

<body>
    <header>
        <h1>HUAC学科ツール</h1>
    </header>

    <main>
        <section class="options">
            <h2>学科試験情報照会</h2>
            <form method="post" action="/GK_db031">
                <div class="data-section">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>氏名</th>
                                <th>法規</th>
                                <th>工学</th>
                                <th>気象</th>
                                <th>航法</th>
                                <th>航特</th>
                                <th>有効期間</th>
                                <th>更新日</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for list in gakkaShikenList %}
                            <tr>
                                <td>{{ list[0] }}</td>
                                <td>{{ list[1] }}</td>
                                <td>{{ list[2] }}</td>
                                <td>{{ list[3] }}</td>
                                <td>{{ list[4] }}</td>
                                <td>{{ list[5] }}</td>
                                <td>{{ list[6] }}</td>
                                <td>{{ list[7] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

                <div class="button-group">
                    <button type="button" onclick="location.href='/GK_menu01'" class="menu-button">戻る</button>
                    <button type="submit" class="execute-button">出力</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
</body>

</html>
