<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUAC学科ツール 養成計画管理セグ・更新（選択）</title>
    <link rel="stylesheet" href="../static/GK1C0062.css">
</head>

<body>
    <header>
        <h1>HUAC学科ツール</h1>
    </header>
    <main>
        <section class="options">
            <h2>養成計画管理セグ・更新（選択）</h2>
            {% if err %}
            <a class="err">{{ err }}</a>
            <br><br>
            {% endif %}
            <a>更新するチームを選択してください。</a>
            <form method="post" action="/GK_db062">
                <div class="data-section">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>選択</th>
                                <th>チーム名</th>
                                <th>チームメンバー</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for team in team_list %}
                            <tr>
                                <td>
                                    <input type="radio" name="selected_team" value="{{ team[0] }}"
                                        id="team_{{ loop.index }}" {% if loop.first %}checked{% endif %}>
                                </td>
                                <td>
                                    <label for="team_{{ loop.index }}">{{ team[0] }}</label>
                                </td>
                                <td>
                                    <label for="team_{{ loop.index }}">{{ team[1] }}</label>
                                </td>

                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <div class="button-group">
                    <button type="button" onclick="location.href='/GK_menu01'" class="menu-button">Menu</button>
                    <button type="submit" class="execute-button">次へ</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Yuichi Taniguchi</p>
    </footer>
    <script>
        // フォーム送信時にチームが選択されているかチェック
        document.querySelector('form').addEventListener('submit', function (e) {
            const selectedTeam = document.querySelector('input[name="selected_team"]:checked');
            if (!selectedTeam) {
                alert('チームを選択してください。');
                e.preventDefault();
            }
        });
    </script>
</body>

</html>
